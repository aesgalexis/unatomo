<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact · unatomo</title>
  <meta name="description" content="Contact form for UNATOMO CORE SL. Send us your questions about machinery and laundry process management.">
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://unatomo.com/nfc/en/contacto.html">
  <link rel="alternate" hreflang="es" href="https://unatomo.com/nfc/es/contacto.html">
  <link rel="alternate" hreflang="en" href="https://unatomo.com/nfc/en/contacto.html">
  <link rel="alternate" hreflang="x-default" href="https://unatomo.com/nfc/es/contacto.html">
  <script src="/static/js/theme/theme-init.js"></script>
  <script src="/static/js/config/runtime-config.js"></script>
  <link rel="icon" href="/static/img/favicon/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/static/css/nfc-landing.css">
</head>
<body class="page nfc-public-page" data-back-mode="history">
  <div id="topbar-mount"></div>
  <script type="module" src="/static/js/nfc-public-topbar.js"></script>
  <main class="shell page-shell">
    <h1 class="public-page-title public-page-title--visually-hidden">Contact</h1>
    <section class="page-section contacto" aria-label="Contact">
      <section class="card contact-form-card ut-contact-form-container" aria-label="Contact form">
<form class="contact-form" action="https://formspree.io/f/mkgqlvqj" method="POST" novalidate>
          <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" style="position:absolute; left:-5000px;" aria-hidden="true">
          <div class="form-grid">
            <div class="form-field"><label for="nombre">Name<span aria-hidden="true"> *</span></label><input id="nombre" name="nombre" type="text" required class="field" autocomplete="name" /></div>
            <div class="form-field"><label for="empresa">Company</label><input id="empresa" name="empresa" type="text" class="field" autocomplete="organization" /></div>
            <div class="form-field"><label for="email">Email<span aria-hidden="true"> *</span></label><input id="email" name="email" type="email" required class="field" autocomplete="email" /></div>
            <div class="form-field"><label for="telefono">Phone</label><input id="telefono" name="telefono" type="tel" class="field" autocomplete="tel" inputmode="tel" /></div>
            <div class="form-field form-field--full"><label for="asunto">Subject<span aria-hidden="true"> *</span></label><select id="asunto" name="asunto" required class="field"><option value="" disabled selected>Select a subject...</option><option>General enquiry</option><option>Registration</option><option>Other</option></select></div>
            <div class="form-field form-field--full"><label for="mensaje">Message<span aria-hidden="true"> *</span></label><textarea id="mensaje" name="mensaje" rows="6" required class="field"></textarea></div><div class="form-consent form-field--full"><label class="form-consent-label" for="privacy-consent"><input id="privacy-consent" name="privacy_consent" type="checkbox" value="accepted" required><span>I accept the <a href="/nfc/en/privacidad.html">privacy and cookie policy</a><span aria-hidden="true"> *</span></span></label></div>
          </div>
          <p class="form-status ut-form-status" role="status" aria-live="polite" hidden></p>
          <div class="ut-form-actions"><button type="submit" class="ut-button ut-button--primary">Send</button></div>
        </form>
      </section>
    </section>
    <div id="page-nav-mount"></div>
    <script type="module" src="/static/js/page-nav.js"></script>
    <div id="legal-footer" class="legal-footer"></div>
    <div class="footer-link"><a href="/nfc/en/privacidad.html">Privacy and cookie policy</a></div>
  </main>
  <script src="/static/js/footer.js"></script>
  <script type="module" src="/static/js/contacto.js"></script>
<script type="module" src="/static/js/site-page-nav.js"></script></body>
</html>
