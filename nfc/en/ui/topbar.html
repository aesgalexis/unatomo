<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-logo-group">
      <a href="/nfc/en/index.html#/dashboard" class="topbar-logo-link" aria-label="Go to dashboard">
        <img
          src="/static/img/logo-unatomo-round-outline-v1.0.svg"
          alt="unatomo"
          class="topbar-logo topbar-logo--rotating"
          loading="lazy"
        />
      </a>
      <div class="topbar-title-wrap" aria-hidden="true">
        <h2 class="topbar-title" id="topbar-title">Home</h2>
        <div class="topbar-status" id="topbar-status" aria-live="polite"></div>
      </div>
    </div>

    <div class="topbar-actions" aria-label="Session">
      <div id="session-menu-wrap">
        <button
          id="session-menu-btn"
          type="button"
          aria-label="User menu"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <span id="session-menu-initials" class="session-menu-avatar" aria-hidden="true"></span>
          <svg
            class="session-menu-chevron"
            viewBox="0 0 24 24"
            aria-hidden="true"
            focusable="false"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="m7 9 5 5 5-5"></path>
          </svg>
        </button>

        <div id="session-menu" role="menu" hidden>
          <div id="session-menu-identity">
            <div id="session-menu-label">Guest</div>
            <div id="session-menu-email" hidden></div>
          </div>
          <a
            id="session-menu-dashboard"
            href="/nfc/en/index.html#/dashboard"
            role="menuitem"
            class="session-menu-link"
            hidden
          >
            Dashboard
          </a>
          <a
            id="session-menu-profile"
            href="/nfc/en/configuracion.html"
            role="menuitem"
            class="session-menu-link"
            hidden
          >
            User
          </a>
          <div id="session-menu-theme-wrap" class="session-menu-submenu-wrap">
            <button
              id="session-menu-theme-toggle"
              class="session-menu-link session-menu-disclosure"
              type="button"
              role="menuitem"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="session-menu-theme-options"
            >
              <svg class="session-menu-link-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3.5"></circle>
                <path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
              </svg>
              <span id="session-menu-theme-label">Theme</span>
              <svg class="session-menu-disclosure-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
            </button>
            <div id="session-menu-theme-options" class="session-menu-submenu" role="group" hidden>
              <button id="session-menu-theme-light" class="session-menu-submenu-option" type="button" role="menuitemradio" aria-checked="false">
                <span>Light</span><span class="session-menu-option-check" aria-hidden="true">&#10003;</span>
              </button>
              <button id="session-menu-theme-dark" class="session-menu-submenu-option" type="button" role="menuitemradio" aria-checked="false">
                <span>Dark</span><span class="session-menu-option-check" aria-hidden="true">&#10003;</span>
              </button>
            </div>
          </div>
          <div id="session-menu-language-wrap" class="session-menu-submenu-wrap" hidden>
            <button
              id="session-menu-language-toggle"
              class="session-menu-link session-menu-disclosure"
              type="button"
              role="menuitem"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="session-menu-language-options"
            >
              <svg class="session-menu-link-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"></path></svg>
              <span id="session-menu-language-label">Language</span>
              <svg class="session-menu-disclosure-chevron" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"></path></svg>
            </button>
            <div id="session-menu-language-options" class="session-menu-submenu" role="group" hidden>
              <a id="lang-link-es" class="session-menu-submenu-option" href="/nfc/es/index.html" lang="es" role="menuitemradio" aria-checked="false"><span>Español</span><span class="session-menu-option-check" aria-hidden="true">&#10003;</span></a>
              <a id="lang-link-en" class="session-menu-submenu-option" href="/nfc/en/index.html" lang="en" role="menuitemradio" aria-checked="false"><span>English</span><span class="session-menu-option-check" aria-hidden="true">&#10003;</span></a>
            </div>
          </div>
          <a
            id="session-menu-action"
            href="/nfc/en/auth/login.html"
            role="menuitem"
            class="session-menu-link"
          >
            Sign in
          </a>
          <a
            id="session-menu-register"
            href="/nfc/en/auth/registro.html"
            role="menuitem"
            class="session-menu-link"
          >
            Register
          </a>
        </div>
      </div>
    </div>
  </div>
</header>
