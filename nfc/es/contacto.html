<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contacto &middot; unatomo</title>
  <meta name="description" content="Formulario de contacto de UNATOMO CORE SL. Envíanos tus consultas sobre maquinaria y procesos de lavado para lavanderías industriales, hoteleras y tintorerías.">
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://unatomo.com/nfc/es/contacto.html">
  <link rel="alternate" hreflang="es" href="https://unatomo.com/nfc/es/contacto.html">
  <link rel="alternate" hreflang="en" href="https://unatomo.com/nfc/en/contacto.html">
  <link rel="alternate" hreflang="x-default" href="https://unatomo.com/nfc/es/contacto.html">
  <script src="/static/js/theme/theme-init.js"></script>
  <script src="/static/js/config/runtime-config.js"></script>
  <link rel="icon" href="/static/img/favicon/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/static/css/nfc-landing.css">
</head>

<body class="page nfc-public-page" data-back-mode="history">
  <div id="topbar-mount"></div>
  <script type="module" src="/static/js/nfc-public-topbar.js"></script>

  <main class="shell page-shell">
    <h1 class="public-page-title public-page-title--visually-hidden">Contacto</h1>
    <section class="page-section contacto" aria-label="Contacto">
      <section class="card contact-form-card" aria-label="Formulario de contacto">
<form class="contact-form" action="https://formspree.io/f/mkgqlvqj" method="POST" novalidate>
          <input
            type="text"
            name="_gotcha"
            tabindex="-1"
            autocomplete="off"
            style="position:absolute; left:-5000px;"
            aria-hidden="true"
          >

          <div class="form-grid">
            <div class="form-field">
              <label for="nombre">Nombre<span aria-hidden="true"> *</span></label>
              <input id="nombre" name="nombre" type="text" required class="field" autocomplete="name" />
            </div>

            <div class="form-field">
              <label for="empresa">Empresa</label>
              <input id="empresa" name="empresa" type="text" class="field" autocomplete="organization" />
            </div>

            <div class="form-field">
              <label for="email">Correo electrónico<span aria-hidden="true"> *</span></label>
              <input id="email" name="email" type="email" required class="field" autocomplete="email" />
            </div>

            <div class="form-field">
              <label for="telefono">Teléfono</label>
              <input
                id="telefono"
                name="telefono"
                type="tel"
                class="field"
                autocomplete="tel"
                inputmode="tel"
              />
            </div>

            <div class="form-field form-field--full">
              <label for="asunto">Asunto<span aria-hidden="true"> *</span></label>
              <select id="asunto" name="asunto" required class="field">
                <option value="" disabled selected>Selecciona un asunto…</option>
                <option>Consulta general</option>
                <option>Registro</option>
                <option>Otros</option>
              </select>
            </div>

            <div class="form-field form-field--full">
              <label for="mensaje">Mensaje<span aria-hidden="true"> *</span></label>
              <textarea id="mensaje" name="mensaje" rows="6" required class="field"></textarea>
            </div><div class="form-consent form-field--full"><label class="form-consent-label" for="privacy-consent"><input id="privacy-consent" name="privacy_consent" type="checkbox" value="accepted" required><span>Acepto la <a href="/nfc/es/privacidad.html">política de privacidad y cookies</a><span aria-hidden="true"> *</span></span></label></div>
          </div>

          <p class="form-status ut-form-status" role="status" aria-live="polite" hidden></p>

          <div class="ut-form-actions">
            <button type="submit" class="ut-button ut-button--primary">Enviar</button>
          </div>
        </form>
      </section>
    </section>

    <div id="page-nav-mount"></div>
    <script type="module" src="/static/js/page-nav.js"></script>

    <div id="legal-footer" class="legal-footer"></div>
    <div class="footer-link">
      <a href="/nfc/es/privacidad.html">Política de privacidad y cookies</a>
    </div>
  </main>

  <script src="/static/js/footer.js"></script>
  <script type="module" src="/static/js/contacto.js"></script>
<script type="module" src="/static/js/site-page-nav.js"></script></body>
</html>
