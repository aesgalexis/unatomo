<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" role="img" aria-labelledby="studio-logo-title studio-logo-desc">
  <title id="studio-logo-title">UNATOMO Studio</title>
  <desc id="studio-logo-desc">Tres módulos cuadrados y un punto que cambia de posición cada dos segundos.</desc>
  <defs>
    <linearGradient id="studio-gradient" x1="52" y1="332" x2="332" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f29500"/>
      <stop offset=".18" stop-color="#efa500"/>
      <stop offset=".48" stop-color="#29a1e2"/>
      <stop offset=".74" stop-color="#22b573"/>
      <stop offset="1" stop-color="#223e73"/>
    </linearGradient>
    <style>
      .frame { opacity: 0; }
      .frame-1 { opacity: 1; animation: frame-1 10.2s steps(1, end) infinite; }
      .frame-2 { animation: frame-2 10.2s steps(1, end) infinite; }
      .frame-3 { animation: frame-3 10.2s steps(1, end) infinite; }
      .frame-4 { animation: frame-4 10.2s steps(1, end) infinite; }
      @keyframes frame-1 { 0%, 24.99% { opacity: 1; } 25%, 100% { opacity: 0; } }
      @keyframes frame-2 { 0%, 24.99% { opacity: 0; } 25%, 49.99% { opacity: 1; } 50%, 100% { opacity: 0; } }
      @keyframes frame-3 { 0%, 49.99% { opacity: 0; } 50%, 74.99% { opacity: 1; } 75%, 100% { opacity: 0; } }
      @keyframes frame-4 { 0%, 74.99% { opacity: 0; } 75%, 100% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        .frame { animation: none; opacity: 0; }
        .frame-1 { opacity: 1; }
      }
    </style>
  </defs>

  <g class="frame frame-1">
    <g fill="none" stroke="url(#studio-gradient)" stroke-width="27" stroke-linejoin="round">
      <rect x="61.5" y="61.5" width="108" height="108" rx="21"/>
      <rect x="214.5" y="61.5" width="108" height="108" rx="21"/>
      <rect x="61.5" y="214.5" width="108" height="108" rx="21"/>
    </g>
    <circle cx="268.5" cy="268.5" r="18" fill="url(#studio-gradient)"/>
  </g>
  <g class="frame frame-2">
    <g fill="none" stroke="url(#studio-gradient)" stroke-width="27" stroke-linejoin="round">
      <rect x="61.5" y="61.5" width="108" height="108" rx="21"/>
      <rect x="61.5" y="214.5" width="108" height="108" rx="21"/>
      <rect x="214.5" y="214.5" width="108" height="108" rx="21"/>
    </g>
    <circle cx="268.5" cy="115.5" r="18" fill="url(#studio-gradient)"/>
  </g>
  <g class="frame frame-3">
    <g fill="none" stroke="url(#studio-gradient)" stroke-width="27" stroke-linejoin="round">
      <rect x="214.5" y="61.5" width="108" height="108" rx="21"/>
      <rect x="61.5" y="214.5" width="108" height="108" rx="21"/>
      <rect x="214.5" y="214.5" width="108" height="108" rx="21"/>
    </g>
    <circle cx="115.5" cy="115.5" r="18" fill="url(#studio-gradient)"/>
  </g>
  <g class="frame frame-4">
    <g fill="none" stroke="url(#studio-gradient)" stroke-width="27" stroke-linejoin="round">
      <rect x="61.5" y="61.5" width="108" height="108" rx="21"/>
      <rect x="214.5" y="61.5" width="108" height="108" rx="21"/>
      <rect x="214.5" y="214.5" width="108" height="108" rx="21"/>
    </g>
    <circle cx="115.5" cy="268.5" r="18" fill="url(#studio-gradient)"/>
  </g>
</svg>
