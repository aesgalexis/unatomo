<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 384" role="img" aria-labelledby="title desc">
  <title id="title">UNATOMO Sense</title>
  <desc id="desc">Tres sensores pulsan por turnos y los puntos interiores responden a cada lectura.</desc>
  <defs>
    <linearGradient id="sense-gradient" x1="40" y1="344" x2="344" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f29500"/>
      <stop offset=".18" stop-color="#efa500"/>
      <stop offset=".48" stop-color="#29a1e2"/>
      <stop offset=".74" stop-color="#22b573"/>
      <stop offset="1" stop-color="#223e73"/>
    </linearGradient>
    <style>
      .sensor, .reading { transform-box: fill-box; transform-origin: center; }
      .sensor { animation: sensor-pulse 8.4s ease-in-out infinite; }
      .reading { animation: reading-pulse 8.4s ease-in-out infinite; }
      .second { animation-delay: 2.1s; }
      .third { animation-delay: 4.2s; }
      @keyframes sensor-pulse {
        0%, 3%, 19%, 100% { transform: scale(1); filter: brightness(1); }
        9% { transform: scale(1.12); filter: brightness(1.65); }
      }
      @keyframes reading-pulse {
        0%, 10%, 28%, 100% { transform: scale(1); filter: brightness(1); }
        17% { transform: scale(1.35); filter: brightness(1.9); }
      }
      @media (prefers-reduced-motion: reduce) {
        .sensor, .reading { animation: none; }
      }
    </style>
  </defs>

  <g fill="none" stroke="url(#sense-gradient)" stroke-width="27" stroke-linecap="round" stroke-linejoin="round">
    <rect x="107" y="112" width="170" height="124" rx="34"/>
    <path d="M107 164H61M277 135l42-42M192 236v49"/>
    <circle class="sensor" cx="38" cy="164" r="20"/>
    <circle class="sensor second" cx="337" cy="75" r="20"/>
    <circle class="sensor third" cx="192" cy="308" r="20"/>
  </g>

  <g fill="url(#sense-gradient)">
    <circle class="reading" cx="145" cy="164" r="15"/>
    <circle class="reading second" cx="239" cy="173" r="15"/>
    <circle class="reading third" cx="192" cy="198" r="15"/>
  </g>
</svg>
